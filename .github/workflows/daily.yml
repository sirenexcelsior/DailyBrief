name: Daily Brief

# Generate and publish a Daily Brief only when manually triggered.
# Automatic cron scheduling is intentionally disabled.

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate today's report
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'daily: report for ${{ github.run_id }}'
